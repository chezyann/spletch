name: Générer le lockfile npm

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Générer package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Vérifier le lockfile
        run: |
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Enregistrer le lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Le lockfile est déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git push
