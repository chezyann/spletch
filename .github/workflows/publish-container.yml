name: Publier l'image Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version à publier, sans le préfixe v
        required: true
        default: 0.5.1
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Déterminer la version
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "repository=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/spletch" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Métadonnées OCI
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=stable
          labels: |
            org.opencontainers.image.title=Spletch!
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Construire et publier amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/synology/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
